<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot de Reservas de Laboratorios</title>
  <link rel="robots" href="robots.txt">
  <meta name="robots" content="noindex, nofollow, max-image-preview:large">

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              300: '#7dd3fc',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            },
            purple: {
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
            }
          },
          animation: {
            'fadeIn': 'fadeIn 0.3s ease-in',
            'slideUp': 'slideUp 0.4s ease-out',
            'bounce-slow': 'bounce 2s infinite',
            'pulse-slow': 'pulse 3s infinite',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            }
          }
        }
      }
    }
  </script>

  <style>
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 10px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .typing-indicator span {
      animation: typing 1.4s infinite;
      opacity: 0.4;
    }

    .typing-indicator span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-indicator span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typing {

      0%,
      60%,
      100% {
        opacity: 0.4;
      }

      30% {
        opacity: 1;
      }
    }

    .glass {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center md:p-6">

  <div class="w-full max-w-4xl animate-slideUp">
    <div class="bg-white md:rounded-2xl shadow-2xl overflow-hidden flex flex-col h-[100dvh] md:h-[88vh] max-h-[1000px]">

      <header class="bg-gradient-to-r from-primary-600 to-purple-600 px-6 py-5 text-white relative overflow-hidden">
        <div class="absolute top-0 right-0 w-64 h-64 bg-white opacity-5 rounded-full -mr-32 -mt-32"></div>
        <div class="absolute bottom-0 left-0 w-48 h-48 bg-white opacity-5 rounded-full -ml-24 -mb-24"></div>

        <img
          src="assets/logo-unisangil.png"
          alt="Logo UNISANGIL"
          class="absolute top-4 right-4 h-12 md:h-14 w-auto object-contain z-20 hidden md:block"
        >

        <div class="relative z-10">
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center space-x-3">
              <div class="w-12 h-12 bg-white bg-opacity-20 rounded-full flex items-center justify-center text-2xl">
                🤖
              </div>
              <div>
                <h2 class="text-xl md:text-2xl font-bold">Chatbot de Laboratorios</h2>
                <p class="text-sm text-primary-100 flex items-center">
                  <span class="w-2 h-2 bg-green-400 rounded-full mr-2 animate-pulse"></span>
                  En línea
                </p>
              </div>
            </div>

          </div>
          <p class="text-sm text-primary-50 mt-2">Consulta disponibilidad o reserva un laboratorio de enfermería</p>
        </div>
      </header>

      <div id="chatWindow"
        class="flex-1 p-4 md:p-6 overflow-y-auto custom-scrollbar bg-gradient-to-b from-gray-50 to-white space-y-4">
      </div>
      <div class="p-4 md:p-6 bg-white border-t border-gray-200">
        <div class="flex items-end space-x-3">
          <div class="flex-1 relative">
            <textarea id="userInput" rows="1" placeholder="Escribe tu mensaje aquí..."
              class="w-full px-4 py-3 pr-12 border-2 border-gray-300 rounded-2xl focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none resize-none transition-all duration-200 text-gray-800 placeholder-gray-400"
              style="max-height: 120px;"></textarea>

            <div id="charCount" class="absolute bottom-2 right-3 text-xs text-gray-400 hidden">
              0/500
            </div>
          </div>

          <button id="sendButton"
            class="bg-gradient-to-r from-primary-600 to-purple-600 text-white p-4 rounded-2xl hover:from-primary-700 hover:to-purple-700 transition-all duration-300 hover:scale-105 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100 shadow-lg hover:shadow-xl group">
            <svg class="w-6 h-6 transform group-hover:translate-x-1 transition-transform" fill="none"
              stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
            </svg>
          </button>
        </div>

        <div class="mt-3 text-xs text-gray-500 flex items-center justify-between">
          <span class="flex items-center">
            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            Presiona Enter para enviar
          </span>
          <span id="statusText" class="text-green-500">● Conectado</span>
        </div>
      </div>

    </div>

    <div class="text-center mt-6 text-[#000] text-sm hidden md:block">
      <p class="mb-2">¿Eres administrador?
        <a href="login.html" class="font-semibold underline hover:text-primary-200 transition-colors">
          Acceder al panel
        </a>
      </p>
      <p class="text-xs text-[#000] text-opacity-60">
        Sistema de Reservas - UNISANGIL © 2025
      </p>
    </div>
  </div>

  <script src="assets/js/chatbot.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const userInput = document.getElementById('userInput');
      const charCount = document.getElementById('charCount');
      const sendButton = document.getElementById('sendButton');

      if (userInput) {
        userInput.addEventListener('input', function () {
          this.style.height = 'auto';
          this.style.height = Math.min(this.scrollHeight, 120) + 'px';

          const length = this.value.length;
          if (length > 400) {
            charCount.textContent = `${length}/500`;
            charCount.classList.remove('hidden');
          } else {
            charCount.classList.add('hidden');
          }
        });

        userInput.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendButton.click();
          }
        });

        userInput.focus();
      }
    });
  </script>
</body>

</html>
